# Nur für die lokale Entwicklung: eine PostgreSQL-Datenbank.
# Die Anwendung selbst läuft dabei über `npm run dev`.
# Das Produktions-Setup steht in docker-compose.dokploy.yml.
services:
  db:
    image: postgres:17-alpine
    container_name: azubiportal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zentrale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zentrale}
      POSTGRES_DB: ${POSTGRES_DB:-zentrale}
      TZ: Europe/Berlin
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zentrale} -d ${POSTGRES_DB:-zentrale}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
