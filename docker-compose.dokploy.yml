# Vollständiger Stapel für Dokploy.
#
# In Dokploy als „Compose"-Anwendung anlegen, dieses Verzeichnis als Quelle
# angeben und als Compose-Datei `docker-compose.dokploy.yml` wählen. Die
# Domain wird in Dokploy auf den Dienst `app`, Port 3000, geroutet – deshalb
# gibt es hier bewusst keine Port-Veröffentlichung.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Europe/Berlin
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Europe/Berlin
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${APP_BASE_URL}
      AUTH_TRUST_HOST: "true"
      AUTH_MICROSOFT_ENTRA_ID_ID: ${AUTH_MICROSOFT_ENTRA_ID_ID}
      AUTH_MICROSOFT_ENTRA_ID_SECRET: ${AUTH_MICROSOFT_ENTRA_ID_SECRET}
      AUTH_MICROSOFT_ENTRA_ID_ISSUER: ${AUTH_MICROSOFT_ENTRA_ID_ISSUER}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS}
      BOOTSTRAP_ADMIN_EMAILS: ${BOOTSTRAP_ADMIN_EMAILS}
      CRON_SECRET: ${CRON_SECRET}
      APP_BASE_URL: ${APP_BASE_URL}
      DEV_LOGIN_ENABLED: "false"
    expose:
      - "3000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "/app/worker.mjs"]
    # Der Worker ruft nur den Cron-Endpunkt auf – Migrationen macht `app`.
    environment:
      TZ: Europe/Berlin
      RUN_MIGRATIONS: "false"
      CRON_SECRET: ${CRON_SECRET}
      APP_INTERNAL_URL: http://app:3000
      REMINDER_CRON: ${REMINDER_CRON:-0 7 * * 1-5}
      PLANNING_CRON: ${PLANNING_CRON:-30 5 * * 1}
    depends_on:
      - app

volumes:
  db-data:
