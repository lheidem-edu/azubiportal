# Bauanleitung für Nixpacks (Dokploy: Build-Typ „Nixpacks").
#
# Die Datenbank läuft getrennt; ihre Adresse kommt über DATABASE_URL herein.
# Vor dem Start werden die Migrationen angewendet – siehe „start" in
# package.json.

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]
# Ohne diese Zeile nimmt Nixpacks zusätzlich „tsconfig.tsbuildinfo" als
# Cache-Verzeichnis auf. Das ist aber eine Datei, und der Build bricht beim
# Einhängen ab („not a directory").
cacheDirectories = [".next/cache", "node_modules/.cache"]

[start]
cmd = "npm run start"
